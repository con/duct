---
name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel  # intel
          - macos-latest  # arm64
          # - windows-latest
          - ubuntu-latest
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy-3.10'
        toxenv: [py]
        include:
          - python-version: '3.10'
            toxenv: lint
            os: ubuntu-latest
          - python-version: '3.10'
            toxenv: typing
            os: ubuntu-latest
          - python-version: '3.10'
            toxenv: minimal
            os: ubuntu-latest
          - python-version: '3.10'
            toxenv: oldestdeps
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch all commits so that versioningit will return something
          # compatible with semantic-version
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --upgrade --upgrade-strategy=eager tox

      - if: matrix.os == 'ubuntu-latest'
        name: Install libjpeg on Ubuntu
        run: sudo apt-get install -y libjpeg-dev

      - name: Install setsid on macOS
        if: runner.os == 'macOS'
        run: |
          brew install util-linux
          echo "$(brew --prefix util-linux)/bin" >> "$GITHUB_PATH"

      - name: Install uv
        if: matrix.toxenv == 'oldestdeps'
        run: python -m pip install uv

      - name: Run tests with coverage
        if: matrix.toxenv == 'py'
        run: tox -e py -- -vv --cov-report=xml

      - name: Run generic tests
        if: matrix.toxenv != 'py'
        run: tox -e ${{ matrix.toxenv }}

      - name: Upload coverage to Codecov
        if: matrix.toxenv == 'py'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          name: ${{ matrix.python-version }}

  # Run the commands which read duct logs against the real-world logs collected
  # in https://github.com/con/duct-gallery, so that a change which breaks
  # reading of the logs produced by released versions of duct gets caught.
  gallery:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # versioningit needs the history, as in the test job
          fetch-depth: 0

      - name: Check out con/duct-gallery repository
        uses: actions/checkout@v4
        with:
          repository: con/duct-gallery
          path: duct-gallery

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install con-duct with all extras
        run: python -m pip install --upgrade ".[all]"

      - name: Run con-duct ls against gallery logs
        run: |
          shopt -s nullglob
          info_files=(duct-gallery/logs/*/*_info.json)
          echo "Found ${#info_files[@]} info files"
          [ "${#info_files[@]}" -gt 0 ]
          for format in summaries json yaml; do
            con-duct ls --format "$format" "${info_files[@]}" > /dev/null
          done
          con-duct ls "${info_files[@]}"

      - name: Run con-duct pp against gallery logs
        run: |
          for info_file in duct-gallery/logs/*/*_info.json; do
            con-duct pp --humanize "$info_file" > /dev/null
          done

      # The gallery keeps logs under names which differ from the ones recorded
      # in output_paths of info.json, so point plot at the usage files.
      - name: Run con-duct plot against gallery logs
        run: |
          shopt -s nullglob
          usage_files=(duct-gallery/logs/*/*_usage.json duct-gallery/logs/*/*_usage.jsonl)
          echo "Found ${#usage_files[@]} usage files"
          [ "${#usage_files[@]}" -gt 0 ]
          mkdir -p gallery-plots
          for usage_file in "${usage_files[@]}"; do
            name=$(basename "$(dirname "$usage_file")")
            for cpu in ps-pcpu ps-cpu-timepoint; do
              con-duct plot "$usage_file" --cpu "$cpu" \
                --output "gallery-plots/${name}_${cpu}.png"
            done
          done

      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-plots-${{ matrix.os }}
          path: gallery-plots/*.png
          if-no-files-found: warn

